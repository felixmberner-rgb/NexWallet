<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NexWallet">
  
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  
  <title>NexWallet Pro</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media', 
      theme: { extend: {} }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18",
        "react-dom/client": "https://esm.sh/react-dom@18/client",
        "lucide-react": "https://esm.sh/lucide-react@0.294.0"
      }
    }
  </script>

  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent; 
      background-color: #f3f4f6; 
      color: #111827;
      overflow-x: hidden;
    }
    @media (prefers-color-scheme: dark) {
      body { background-color: #111827; color: #f3f4f6; }
    }

    .header-fixed {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding-top: max(16px, env(safe-area-inset-top));
      z-index: 40;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      .header-fixed {
        background: rgba(17, 24, 39, 0.95);
        border-bottom: 1px solid #374151;
      }
    }

    .main-content {
      padding-top: max(130px, env(safe-area-inset-top) + 110px);
      padding-bottom: max(120px, env(safe-area-inset-bottom) + 100px);
      min-height: 100vh;
      box-sizing: border-box;
    }

    .liquid-nav {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border-radius: 40px;
      display: flex;
      padding: 8px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05);
      z-index: 1000;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
    }
    @media (prefers-color-scheme: dark) {
      .liquid-nav {
        background: rgba(30, 30, 30, 0.75);
        box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
      }
    }
    
    .liquid-nav.nav-hidden {
      transform: translate(-50%, 150%);
      opacity: 0;
      pointer-events: none;
    }

    .nav-item {
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 14px;
      color: #6b7280;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      user-select: none;
      white-space: nowrap;
    }
    @media (prefers-color-scheme: dark) { .nav-item { color: #9ca3af; } }
    
    .nav-item.active {
      background: #2563eb;
      color: white;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      PlusCircle, Wallet, Archive, Upload, Download, X, Check,
      MinusCircle, CreditCard, RefreshCcw, Image as ImageIcon,
      Edit2, Trash2, Ticket, Tag, Star, Shapes, CopyPlus, CheckSquare, Square, Lock, Clipboard
    } from 'lucide-react';

    const CATEGORIES = {
      coupon: { id: 'coupon', label: 'Gutschein', icon: Tag, color: 'text-orange-500', bg: 'bg-orange-100' },
      loyalty: { id: 'loyalty', label: 'Mitgliedskarte', icon: Star, color: 'text-purple-500', bg: 'bg-purple-100' },
      ticket: { id: 'ticket', label: 'Ticket', icon: Ticket, color: 'text-blue-500', bg: 'bg-blue-100' },
      custom: { id: 'custom', label: 'Sonstiges', icon: Shapes, color: 'text-gray-500', bg: 'bg-gray-200' }
    };

    function NexWallet() {
      const [cards, setCards] = useState(() => {
        try {
          const saved = localStorage.getItem('nex_cards');
          return saved ? JSON.parse(saved) : [];
        } catch(e) { return []; }
      });
      const [templates, setTemplates] = useState(() => {
        try {
          const saved = localStorage.getItem('nex_templates');
          return saved ? JSON.parse(saved) : [];
        } catch(e) { return []; }
      });

      const [currentView, setCurrentView] = useState('wallet'); 
      const [activeCategoryTab, setActiveCategoryTab] = useState('all'); 
      
      const [isCreatorOpen, setIsCreatorOpen] = useState(false); 
      const [editingCard, setEditingCard] = useState(null); 
      const [selectedCategory, setSelectedCategory] = useState('custom');

      const [redeemModal, setRedeemModal] = useState({ isOpen: false, cardId: null });
      const [redeemAmount, setRedeemAmount] = useState('');
      const [fullscreenCode, setFullscreenCode] = useState(null);
      const [toast, setToast] = useState(null);
      const [isKeyboardOpen, setIsKeyboardOpen] = useState(false);

      useEffect(() => {
        localStorage.setItem('nex_cards', JSON.stringify(cards));
        localStorage.setItem('nex_templates', JSON.stringify(templates));
      }, [cards, templates]);

      useEffect(() => {
        const currentCats = [...new Set(cards.filter(c => !c.isGifted && !c.isRedeemed).map(c => CATEGORIES[c.category] ? c.category : 'custom'))];
        if (activeCategoryTab !== 'all' && !currentCats.includes(activeCategoryTab)) {
          setActiveCategoryTab('all');
        }
      }, [cards, activeCategoryTab]);

      useEffect(() => {
        const today = new Date().toISOString().split('T')[0];
        setCards(prevCards => {
          const validCards = prevCards.filter(c => {
             if (!c.expiryDate) return true;
             if (c.expiryDate.length !== 10 || !c.expiryDate.includes('-')) return true;
             return c.expiryDate >= today;
          });
          return validCards.length !== prevCards.length ? validCards : prevCards;
        });

        if ('serviceWorker' in navigator) {
          const swCode = `self.addEventListener('fetch', (e) => { e.respondWith(caches.match(e.request).then(res => res || fetch(e.request))); });`;
          const blob = new Blob([swCode], {type: 'application/javascript'});
          navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
        }

        const handleFocusIn = (e) => {
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) setIsKeyboardOpen(true);
        };
        const handleFocusOut = (e) => {
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
                setTimeout(() => {
                    if (!['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
                        setIsKeyboardOpen(false);
                    }
                }, 20);
            }
        };

        document.addEventListener('focusin', handleFocusIn);
        document.addEventListener('focusout', handleFocusOut);

        // Fallback: Falls jemand die URL in Safari öffnet, funktioniert es hierüber weiterhin
        const urlHref = window.location.href;
        if (urlHref.includes('action=create')) {
          try {
            const getParam = (param) => {
               const regex = new RegExp('[?&]' + param + '=([^&]*)', 'i');
               const match = urlHref.match(regex);
               return match ? decodeURIComponent(match[1]) : '';
            };
            const shortcutCard = {
              title: getParam('title'), description: getParam('desc'),
              initialValue: getParam('val'), codeValue: getParam('code'),
              codeType: getParam('type') || 'BARCODE', category: getParam('cat') || 'coupon',
              expiryDate: getParam('expiry'), pin: getParam('pin'),
              customOptions: { canRedeem: true, canGift: true }
            };
            setEditingCard(shortcutCard); setSelectedCategory(shortcutCard.category || 'custom');
            setCurrentView('wallet'); setTimeout(() => setIsCreatorOpen(true), 100);
            try { window.history.replaceState({}, document.title, urlHref.split('?')[0]); } catch(err) {}
          } catch(e) {}
        }

        return () => {
           document.removeEventListener('focusin', handleFocusIn);
           document.removeEventListener('focusout', handleFocusOut);
        };
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const handlePartialRedeem = () => {
        const amount = parseFloat(redeemAmount.replace(',', '.'));
        if (isNaN(amount) || amount <= 0) return;

        setCards(cards.map(card => {
          if (card.id === redeemModal.cardId) {
            const newValue = Math.max(0, card.currentValue - amount);
            return { ...card, currentValue: newValue, isRedeemed: newValue === 0 };
          }
          return card;
        }));
        setRedeemModal({ isOpen: false, cardId: null });
        setRedeemAmount('');
      };

      const handleFullRedeem = (cardId) => {
        setCards(cards.map(card => card.id === cardId ? { ...card, isRedeemed: true, currentValue: 0 } : card));
        showToast("Eingelöst und archiviert");
      };

      const toggleGifted = (id) => {
        setCards(cards.map(card => card.id === id ? { ...card, isGifted: !card.isGifted } : card));
      };

      const deleteTemplate = (id, e) => {
        e.stopPropagation();
        if(window.confirm("Vorlage wirklich löschen?")) {
           setTemplates(templates.filter(t => t.id !== id));
           showToast("Vorlage gelöscht");
        }
      };

      const parseImportedFile = (fileText) => {
        let text = String(fileText);
        text = text.replace(/```json/gi, '').replace(/```/gi, '');
        text = text.replace(/[“”]/g, '"').replace(/[‘’]/g, "'");

        try { return JSON.parse(text); } catch(e) {}

        let startIdx = text.indexOf('[');
        let objIdx = text.indexOf('{');
        if (startIdx === -1 || (objIdx !== -1 && objIdx < startIdx)) startIdx = objIdx;
        
        let endIdx = text.lastIndexOf(']');
        let objEndIdx = text.lastIndexOf('}');
        if (endIdx === -1 || (objEndIdx !== -1 && objEndIdx > endIdx)) endIdx = objEndIdx;

        if (startIdx !== -1 && endIdx !== -1 && startIdx < endIdx) {
            let possibleJson = text.substring(startIdx, endIdx + 1);
            possibleJson = possibleJson.replace(/\\par[ \d]*\n?/g, ''); 
            possibleJson = possibleJson.replace(/\\[a-z0-9]+\s?/gi, ''); 
            possibleJson = possibleJson.replace(/\\/g, ''); 
            
            try { return JSON.parse(possibleJson); } catch(e) {}
        }
        throw new Error("Ungültiges Format");
      };

      // --- NEU: ZWISCHENABLAGE (SMART PASTE) LOGIK ---
      const importFromClipboard = async () => {
        try {
          const text = await navigator.clipboard.readText();
          if (!text) {
             showToast("Zwischenablage ist leer!");
             return;
          }
          const data = parseImportedFile(text);
          const list = Array.isArray(data) ? data : [data];
          
          if (list.length > 0) {
              const shortcutCard = {
                title: list[0].title || '', 
                description: list[0].description || '',
                initialValue: list[0].initialValue || '', 
                codeValue: list[0].codeValue || '',
                codeType: list[0].codeType || 'BARCODE', 
                category: list[0].category || 'coupon',
                expiryDate: list[0].expiryDate || '', 
                pin: list[0].pin || '',
                customOptions: list[0].customOptions || { canRedeem: true, canGift: true }
              };
              setEditingCard(shortcutCard); 
              setSelectedCategory(shortcutCard.category || 'custom');
              setCurrentView('wallet');
              setIsCreatorOpen(true);
          }
        } catch(err) {
          console.error("Clipboard Error:", err);
          alert("Kein gültiger Karten-Code in der Zwischenablage gefunden. Bitte kopiere das Ergebnis zuerst!");
        }
      };

      const importData = (event) => {
        const files = event.target.files;
        if (!files.length) return;
        
        Array.from(files).forEach(file => {
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const data = parseImportedFile(e.target.result);
              const list = Array.isArray(data) ? data : [data];
              
              const normalizedList = list.map(c => ({
                 ...c,
                 id: String(c.id || Date.now() + Math.random())
              }));

              setCards(prev => {
                const existingIds = new Set(prev.map(c => String(c.id)));
                const fresh = normalizedList.filter(c => !existingIds.has(c.id));
                return [...prev, ...fresh];
              });

              showToast("Import erfolgreich");
            } catch(err) {
              alert("Fehler beim Lesen der Datei. Bitte stelle sicher, dass die Datei validen Text enthält.");
            }
          };
          reader.readAsText(file);
        });
        event.target.value = ''; 
      };

      const openEditor = (card) => {
        setEditingCard(card);
        setSelectedCategory(card.category || 'custom');
        setIsCreatorOpen(true);
      };

      const activeCards = cards.filter(c => !c.isGifted && !c.isRedeemed);
      const archivedCards = cards.filter(c => c.isGifted || c.isRedeemed);
      const presentCategories = [...new Set(activeCards.map(c => CATEGORIES[c.category] ? c.category : 'custom'))];

      const hideNav = isKeyboardOpen || fullscreenCode !== null || isCreatorOpen || redeemModal.isOpen;

      return (
        <div className="w-full text-gray-900 dark:text-gray-100 transition-colors duration-300">
          
          <header className="header-fixed px-5 pb-2">
            <div className="flex justify-between items-center pb-2 mt-2">
              <h1 className="text-[28px] leading-tight font-extrabold tracking-tight">
                {currentView === 'wallet' && 'NexWallet'}
                {currentView === 'gifted' && 'Archiv'}
                {currentView === 'category-select' && 'Neu erstellen'}
              </h1>
              {(currentView === 'wallet' || currentView === 'gifted') && (
                <div className="flex space-x-2">
                  
                  {/* NEU: Smart Paste Button */}
                  <button onClick={importFromClipboard} className="p-2 bg-blue-50 dark:bg-blue-900/40 rounded-full hover:bg-blue-100 dark:hover:bg-blue-900/60 transition active:scale-90">
                    <Clipboard size={18} className="text-blue-600 dark:text-blue-400" />
                  </button>

                  <label className="cursor-pointer p-2 bg-gray-100 dark:bg-gray-800 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition active:scale-90">
                    <Upload size={18} className="text-gray-700 dark:text-gray-200" />
                    <input type="file" multiple accept=".nexwallet,.json,.txt,.rtf,*/*" className="hidden" onChange={importData} />
                  </label>
                  <button onClick={() => {
                    const blob = new Blob([JSON.stringify(cards)], {type: 'application/json'});
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob); a.download = `NexWallet_Export.nexwallet`; a.click();
                  }} className="p-2 bg-gray-100 dark:bg-gray-800 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition active:scale-90">
                    <Download size={18} className="text-gray-700 dark:text-gray-200" />
                  </button>
                </div>
              )}
            </div>

            {currentView === 'wallet' && (
              <div className="pt-2 pb-1 overflow-x-auto hide-scrollbar flex space-x-2">
                <button 
                  onClick={() => setActiveCategoryTab('all')}
                  className={`whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-bold transition ${activeCategoryTab === 'all' ? 'bg-black dark:bg-white text-white dark:text-black' : 'bg-gray-200 dark:bg-gray-800 text-gray-500 dark:text-gray-300'}`}
                >
                  Alle
                </button>
                {presentCategories.map(cat => {
                  const catData = CATEGORIES[cat] || CATEGORIES['custom'];
                  return (
                    <button 
                      key={cat}
                      onClick={() => setActiveCategoryTab(cat)}
                      className={`whitespace-nowrap flex items-center gap-1.5 px-4 py-1.5 rounded-full text-sm font-bold transition ${activeCategoryTab === cat ? 'bg-black dark:bg-white text-white dark:text-black' : 'bg-gray-200 dark:bg-gray-800 text-gray-500 dark:text-gray-300'}`}
                    >
                      {React.createElement(catData.icon, { size: 14 })}
                      {catData.label}
                    </button>
                  );
                })}
              </div>
            )}
          </header>

          {toast && (
            <div className="fixed top-32 left-1/2 -translate-x-1/2 z-[100] bg-gray-800 dark:bg-gray-200 text-white dark:text-gray-900 px-6 py-3 rounded-full text-sm font-bold shadow-2xl animate-in fade-in slide-in-from-top-4">
              {toast}
            </div>
          )}

          <main className="main-content px-4">
            {currentView === 'wallet' && (
              <div className="space-y-6">
                {activeCards.length === 0 ? (
                  <div className="text-center text-gray-400 dark:text-gray-500 mt-20">Keine Karten vorhanden.</div>
                ) : (
                  activeCards.filter(c => activeCategoryTab === 'all' || (c.category || 'custom') === activeCategoryTab).map(card => (
                    <WalletCard 
                      key={card.id} card={card} 
                      onPartialRedeem={() => setRedeemModal({ isOpen: true, cardId: card.id })}
                      onFullRedeem={() => handleFullRedeem(card.id)}
                      onToggleGift={() => toggleGifted(card.id)}
                      onEdit={() => openEditor(card)}
                      onFullscreen={() => setFullscreenCode(card)}
                      formatCurrency={(v) => new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(v)}
                    />
                  ))
                )}
              </div>
            )}

            {currentView === 'gifted' && (
              <div className="space-y-6">
                {archivedCards.length === 0 ? (
                  <div className="text-center text-gray-400 dark:text-gray-500 mt-32">
                    <Archive size={48} className="mx-auto mb-4 opacity-30" />
                    <p>Aktuell sind keine Karten archiviert.</p>
                  </div>
                ) : (
                  archivedCards.map(card => (
                    <div key={card.id} className="opacity-75 grayscale hover:grayscale-0 transition-all duration-300">
                      <WalletCard 
                        card={card} 
                        onToggleGift={() => toggleGifted(card.id)}
                        onRestore={() => setCards(cards.map(c => c.id === card.id ? {...c, isRedeemed: false, currentValue: c.initialValue} : c))}
                        onDelete={() => { if(window.confirm("Karte dauerhaft löschen?")) setCards(cards.filter(c => c.id !== card.id)) }}
                        onEdit={() => openEditor(card)}
                        formatCurrency={(v) => new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(v)}
                        isArchivedView={true}
                      />
                    </div>
                  ))
                )}
              </div>
            )}

            {currentView === 'category-select' && (
              <div className="space-y-8 animate-in fade-in mt-4">
                <div className="grid grid-cols-2 gap-4">
                  {Object.values(CATEGORIES).map(cat => (
                    <button key={cat.id} onClick={() => { setSelectedCategory(cat.id); setEditingCard(null); setIsCreatorOpen(true); }} className="bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col items-center active:scale-95 transition">
                      <div className={`w-14 h-14 rounded-full flex items-center justify-center mb-3 ${cat.bg} ${cat.color} dark:bg-opacity-20`}><cat.icon size={28} /></div>
                      <span className="font-bold text-gray-800 dark:text-gray-100 text-sm">{cat.label}</span>
                    </button>
                  ))}
                </div>
                {templates.length > 0 && (
                  <div>
                    <h3 className="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-4 ml-2">Vorlagen</h3>
                    <div className="space-y-3">
                      {templates.map(tmpl => {
                        const tCat = CATEGORIES[tmpl.category] || CATEGORIES['custom'];
                        return (
                          <div key={tmpl.id} onClick={() => { setEditingCard({...tmpl, id: null, currentValue: tmpl.initialValue}); setSelectedCategory(tmpl.category || 'custom'); setIsCreatorOpen(true); }} className="w-full flex items-center justify-between p-4 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 cursor-pointer active:scale-95 transition">
                            <div className="flex items-center gap-3">
                              <div className={`w-10 h-10 rounded-full flex items-center justify-center ${tCat.bg} ${tCat.color} dark:bg-opacity-20`}>{React.createElement(tCat.icon, { size: 18 })}</div>
                              <p className="font-bold text-gray-800 dark:text-gray-100">{tmpl.title || 'Vorlage'}</p>
                            </div>
                            <button onClick={(e) => deleteTemplate(tmpl.id, e)} className="p-2 text-red-400 hover:text-red-600 bg-red-50 dark:bg-red-900/20 rounded-full"><Trash2 size={16} /></button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {isCreatorOpen && (
            <div className="fixed inset-0 z-[150] flex items-end sm:items-center justify-center bg-black/50 backdrop-blur-sm p-0 sm:p-4 animate-in fade-in" onClick={() => setIsCreatorOpen(false)}>
              <div 
                className="w-full max-w-lg max-h-[92vh] overflow-y-auto overflow-x-hidden bg-white dark:bg-gray-800 rounded-t-[2rem] sm:rounded-[2rem] shadow-2xl slide-in-from-bottom-8 flex flex-col hide-scrollbar" 
                onClick={e => e.stopPropagation()}
              >
                <CardCreator 
                  initialData={editingCard}
                  category={selectedCategory}
                  onSave={(newCard) => {
                    if (editingCard && editingCard.id) {
                      setCards(cards.map(c => c.id === newCard.id ? newCard : c));
                    } else {
                      setCards([...cards, { ...newCard, id: Date.now().toString() }]);
                      setCurrentView('wallet'); 
                      setActiveCategoryTab('all');
                    }
                    setIsCreatorOpen(false);
                    setEditingCard(null);
                  }} 
                  onSaveTemplate={(tmpl) => { setTemplates([...templates, {...tmpl, id: Date.now().toString()}]); showToast("Vorlage gespeichert!"); }}
                  onCancel={() => { setIsCreatorOpen(false); setEditingCard(null); }}
                  onDelete={editingCard && editingCard.id ? () => { setCards(cards.filter(c => c.id !== editingCard.id)); setIsCreatorOpen(false); setEditingCard(null); } : null}
                />
              </div>
            </div>
          )}

          <nav className={`liquid-nav ${hideNav ? 'nav-hidden' : ''}`}>
            <div onClick={() => { setIsCreatorOpen(false); setActiveCategoryTab('all'); setCurrentView('wallet'); }} className={`nav-item ${currentView === 'wallet' ? 'active' : ''}`}>
              <Wallet size={18} /><span>Wallet</span>
            </div>
            <div onClick={() => { setIsCreatorOpen(false); setCurrentView('category-select'); }} className={`nav-item ${currentView === 'category-select' ? 'active' : ''}`}>
              <PlusCircle size={18} /><span>Neu</span>
            </div>
            <div onClick={() => { setIsCreatorOpen(false); setCurrentView('gifted'); }} className={`nav-item ${currentView === 'gifted' ? 'active' : ''}`}>
              <Archive size={18} /><span>Archiv</span>
            </div>
          </nav>

          {fullscreenCode && (
            <div className="fixed inset-0 z-[200] bg-white flex items-center justify-center animate-in zoom-in-95 duration-200" onClick={() => setFullscreenCode(null)}>
              <button className="absolute top-12 right-6 p-3 bg-gray-100 rounded-full text-black z-50"><X size={28} /></button>
              <div className="transform rotate-90 flex flex-col items-center justify-center">
                <LocalCodeGenerator type={fullscreenCode.codeType} value={fullscreenCode.codeValue} className={fullscreenCode.codeType === 'QR' ? 'w-[40vh] h-[40vh]' : 'w-[75vh] h-[25vh]'} />
                <p className="text-2xl font-mono mt-8 text-black tracking-widest">{fullscreenCode.codeValue}</p>
                
                {fullscreenCode.pin && (
                  <div className="mt-8 bg-gray-100 px-6 py-3 rounded-2xl flex items-center gap-4 shadow-sm border border-gray-200">
                    <span className="text-gray-400 font-bold uppercase text-xs tracking-widest">PIN</span>
                    <span className="text-black font-mono font-bold text-2xl tracking-widest">{fullscreenCode.pin}</span>
                  </div>
                )}
              </div>
            </div>
          )}

          {redeemModal.isOpen && (
            <div className="fixed inset-0 z-[100] flex items-end justify-center bg-black/40 backdrop-blur-sm p-4 animate-in fade-in">
              <div className="bg-white dark:bg-gray-800 w-full max-w-md rounded-3xl p-6 shadow-2xl mb-8">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-bold dark:text-white">Betrag abziehen</h3>
                  <button onClick={() => setRedeemModal({isOpen: false, cardId: null})} className="p-2 bg-gray-100 dark:bg-gray-700 rounded-full"><X size={20} className="dark:text-white" /></button>
                </div>
                <div className="bg-gray-100 dark:bg-gray-700 rounded-2xl p-4 mb-6 flex justify-between items-center text-2xl font-semibold">
                  <span className="dark:text-white">-</span>
                  <div className="flex items-center">
                    <input type="text" inputMode="decimal" pattern="[0-9]*" value={redeemAmount} onChange={(e) => setRedeemAmount(e.target.value)} placeholder="0,00" className="bg-transparent text-right outline-none w-32 mr-2 font-bold text-red-500" autoFocus />
                    <span className="dark:text-white">€</span>
                  </div>
                </div>
                <button onClick={handlePartialRedeem} className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all">Bestätigen</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function LocalCodeGenerator({ type, value, className }) {
      const canvasRef = useRef(null);
      const svgRef = useRef(null);
      useEffect(() => {
        if (!value) return;
        if (type === 'QR' && window.QRCode && canvasRef.current) {
          window.QRCode.toCanvas(canvasRef.current, value, { width: 400, margin: 1 }, () => {});
        } else if (type === 'BARCODE' && window.JsBarcode && svgRef.current) {
          try { window.JsBarcode(svgRef.current, value, { format: "CODE128", displayValue: false, margin: 0, lineColor: "#000", background: "#ffffff" }); } catch (err) {}
        }
      }, [type, value]);
      if (type === 'QR') return <canvas ref={canvasRef} className={className} />;
      return <svg ref={svgRef} className={`object-contain bg-white rounded-xl ${className}`} />;
    }

    function WalletCard({ card, onPartialRedeem, onFullRedeem, onToggleGift, onEdit, onFullscreen, onRestore, onDelete, formatCurrency, isArchivedView }) {
      const [showDelConfirm, setShowDelConfirm] = useState(false);
      
      const isCoupon = card.category === 'coupon';
      const isTicket = card.category === 'ticket';
      const canRedeem = isCoupon || isTicket || (card.category === 'custom' && card.customOptions?.canRedeem);
      const canGift = isCoupon || isTicket || (card.category === 'custom' && card.customOptions?.canGift);
      const percentLeft = card.initialValue > 0 ? (card.currentValue / card.initialValue) * 100 : 0;
      
      const showValueBlock = isCoupon || (card.category === 'custom' && card.customOptions?.canRedeem);

      const renderDate = (dateStr) => {
        if (!dateStr) return '';
        try {
           const d = new Date(dateStr);
           if (isNaN(d.getTime())) return dateStr;
           return d.toLocaleDateString('de-DE');
        } catch(e) { return dateStr; }
      };

      return (
        <div onClick={!isArchivedView ? onFullscreen : undefined} className={`relative w-full rounded-[2rem] shadow-xl overflow-hidden text-white bg-gradient-to-br ${card.colorCode || 'from-gray-700 to-gray-900'} transition-transform active:scale-[0.98]`}>
          <div className="p-6 pb-4 flex justify-between items-start">
            <div className="flex-1 pr-4">
              <h2 className="text-2xl font-bold tracking-tight leading-tight">{card.title}</h2>
              <p className="text-white/80 font-medium mt-1">{card.description}</p>
              
              <div className="flex flex-wrap gap-3 mt-3">
                  {card.expiryDate && (
                    <p className="bg-black/20 px-2 py-1 rounded-md text-white/90 font-bold text-xs flex items-center gap-1 backdrop-blur-sm">
                      {card.category === 'ticket' ? '📅' : '⏳'} {renderDate(card.expiryDate)}
                    </p>
                  )}
                  {card.pin && (
                    <p className="bg-black/20 px-2 py-1 rounded-md text-white/90 font-bold text-xs flex items-center gap-1 backdrop-blur-sm">
                      <Lock size={12}/> PIN
                    </p>
                  )}
              </div>
            </div>
            <div className="flex flex-col items-end space-y-3">
               <button onClick={(e) => { e.stopPropagation(); onEdit(); }} className="p-2 bg-white/20 rounded-full backdrop-blur-md transition"><Edit2 size={16} className="text-white" /></button>
              {card.image && (
                <div className="w-14 h-14 bg-white rounded-2xl p-1 shadow-lg border border-white/50"><img src={card.image} alt="Logo" className="w-full h-full rounded-xl object-cover" /></div>
              )}
            </div>
          </div>
          
          {showValueBlock && (
            <div className="px-6 pb-6 pt-2">
              <div className="flex justify-between items-end mb-2">
                <span className="text-xs font-bold text-white/60 uppercase tracking-widest">Restwert</span>
                <span className="text-3xl font-bold">{formatCurrency(card.currentValue || 0)}</span>
              </div>
              {card.initialValue > 0 && (
                  <div className="w-full bg-white/20 rounded-full h-2 overflow-hidden shadow-inner">
                    <div className="bg-white h-full rounded-full transition-all duration-1000" style={{ width: `${percentLeft}%` }}></div>
                  </div>
              )}
            </div>
          )}
          
          {isArchivedView && (
            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 rotate-[-12deg] border-4 border-white/60 rounded-2xl px-6 py-2 z-20 pointer-events-none">
              <span className="text-4xl font-black text-white/60 uppercase tracking-tighter">{card.isRedeemed ? 'Eingelöst' : 'Verschenkt'}</span>
            </div>
          )}
          
          {!isArchivedView && (canRedeem || canGift) && (
            <div className="bg-white/10 backdrop-blur-md flex justify-between p-3 border-t border-white/20 relative z-10">
              {canRedeem && card.currentValue > 0 && showValueBlock && (
                <button onClick={(e) => { e.stopPropagation(); onPartialRedeem(); }} className="flex items-center space-x-2 px-5 py-2.5 bg-white/20 text-white rounded-full text-sm font-bold active:bg-white/40 shadow-lg">
                  <MinusCircle size={16} /><span>Einlösen</span>
                </button>
              )}
              {canRedeem && (!showValueBlock || card.currentValue === 0) && (
                 <button onClick={(e) => { e.stopPropagation(); onFullRedeem(); }} className="flex items-center space-x-2 px-5 py-2.5 bg-white/20 text-white rounded-full text-sm font-bold active:bg-white/40 shadow-lg">
                  <MinusCircle size={16} /><span>Einlösen</span>
                </button>
              )}
              {canGift && (!showValueBlock || card.currentValue === card.initialValue || !card.initialValue) && (
                <button onClick={(e) => { e.stopPropagation(); onToggleGift(); }} className="flex items-center space-x-2 px-5 py-2.5 bg-white/20 text-white rounded-full text-sm font-bold ml-auto shadow-lg">
                  <Archive size={16} /><span>Verschenken</span>
                </button>
              )}
            </div>
          )}

          {isArchivedView && (
            <div className="bg-white/10 backdrop-blur-md flex justify-between items-center p-3 border-t border-white/20 relative z-10">
              {!showDelConfirm ? (
                 <>
                   <button onClick={(e) => { e.stopPropagation(); setShowDelConfirm(true); }} className="flex items-center space-x-2 px-4 py-2 bg-red-500/80 text-white rounded-full text-sm font-bold shadow-lg">
                     <Trash2 size={16} /><span>Löschen</span>
                   </button>
                   <button onClick={(e) => { e.stopPropagation(); if (card.isRedeemed) onRestore(); else onToggleGift(); }} className="flex items-center space-x-2 px-5 py-2.5 bg-white/20 text-white rounded-full text-sm font-bold shadow-lg ml-auto">
                     <RefreshCcw size={16} /><span>Wiederherstellen</span>
                   </button>
                 </>
              ) : (
                 <div className="flex space-x-2 w-full animate-in fade-in slide-in-from-left-4">
                   <button onClick={(e) => { e.stopPropagation(); setShowDelConfirm(false); }} className="flex-1 px-4 py-2 bg-white/20 text-white rounded-full text-sm font-bold">Abbrechen</button>
                   <button onClick={(e) => { e.stopPropagation(); onDelete(); setShowDelConfirm(false); }} className="flex-1 px-4 py-2 bg-red-500 text-white rounded-full text-sm font-bold shadow-lg">Löschen</button>
                 </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function CardCreator({ initialData, category, onSave, onSaveTemplate, onCancel, onDelete }) {
      const catData = CATEGORIES[category] || CATEGORIES['custom'];

      const [formData, setFormData] = useState({
        title: initialData?.title || '', 
        description: initialData?.description || '', 
        image: initialData?.image || null, 
        initialValue: initialData?.initialValue !== undefined ? initialData.initialValue : '', 
        currentValue: initialData?.currentValue !== undefined ? initialData.currentValue : '', 
        codeType: initialData?.codeType || 'BARCODE', 
        codeValue: initialData?.codeValue || '', 
        colorCode: initialData?.colorCode || 'from-blue-500 to-indigo-600', 
        category: category || 'custom', 
        expiryDate: initialData?.expiryDate || '',
        pin: initialData?.pin || '',
        customOptions: initialData?.customOptions || { canRedeem: true, canGift: true }
      });
      
      const [isScanning, setIsScanning] = useState(false);
      const [showExpiryField, setShowExpiryField] = useState(!!initialData?.expiryDate);
      const [showPinField, setShowPinField] = useState(!!initialData?.pin);
      const [showDel, setShowDel] = useState(false);

      const colors = ['from-blue-500 to-indigo-600', 'from-orange-400 to-red-500', 'from-emerald-400 to-teal-500', 'from-pink-500 to-rose-600', 'from-gray-700 to-gray-900', 'from-yellow-400 to-orange-500'];

      const saveAction = () => {
        if (!formData.title) return alert('Bitte gib zumindest einen Titel ein.');
        let initVal = isNaN(parseFloat(String(formData.initialValue).replace(',', '.'))) ? 0 : parseFloat(String(formData.initialValue).replace(',', '.'));
        let currVal = isNaN(parseFloat(String(formData.currentValue).replace(',', '.'))) ? initVal : parseFloat(String(formData.currentValue).replace(',', '.'));
        
        if (formData.category === 'ticket' || formData.category === 'loyalty' || (formData.category === 'custom' && !formData.customOptions.canRedeem)) {
            initVal = 0;
            currVal = 0;
        }

        let finalExpiry = formData.expiryDate;
        if (formData.category === 'loyalty') finalExpiry = '';
        
        onSave({ 
          ...formData, 
          id: initialData?.id, 
          initialValue: initVal, 
          currentValue: currVal, 
          expiryDate: finalExpiry,
          pin: formData.pin,
          category: formData.category 
        });
      };

      const scanBarcode = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsScanning(true);
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = async () => {
          let found = null;
          if (window.ZXing) {
            try { const reader = new window.ZXing.BrowserMultiFormatReader(); const res = await reader.decodeFromImageElement(img); found = res.text; } catch(e) {}
          }
          if (!found && 'BarcodeDetector' in window) {
            try { const det = new window.BarcodeDetector(); const res = await det.detect(img); if (res.length) found = res[0].rawValue; } catch(e) {}
          }
          if (found) { setFormData({...formData, codeValue: found}); alert("Code erkannt!"); }
          else alert("Kein Code gefunden. Versuche ein schärferes Bild.");
          setIsScanning(false);
        };
      };

      return (
        <div className="flex flex-col w-full h-full pb-safe">
          <div id="reader-hidden" style={{display:'none'}}></div>
          <div className={`p-6 pt-8 text-white bg-gradient-to-br ${formData.colorCode} flex-shrink-0 transition-colors duration-500`}>
            <div className="flex justify-between items-center mb-6">
              <button onClick={onCancel} className="p-2 bg-white/20 rounded-full backdrop-blur-md"><X size={20} /></button>
              <span className="font-bold">{initialData && initialData.id ? 'Bearbeiten' : catData.label}</span>
              <button onClick={saveAction} className="p-2 bg-white text-black rounded-full shadow-md"><Check size={20} /></button>
            </div>
            <input type="text" placeholder="Titel..." className="w-full bg-transparent text-3xl font-bold outline-none placeholder-white/40 mb-2" value={formData.title} onChange={(e) => setFormData({...formData, title: e.target.value})} />
            <input type="text" placeholder={formData.category === 'ticket' ? 'Infos / Platz' : 'Beschreibung'} className="w-full bg-transparent text-white/80 outline-none placeholder-white/40 mb-2" value={formData.description} onChange={(e) => setFormData({...formData, description: e.target.value})} />
          </div>

          <div className="p-6 space-y-6 flex-1 bg-white dark:bg-gray-800">
            
            <div className="bg-gray-100 dark:bg-gray-700 p-4 rounded-2xl border border-gray-200 dark:border-gray-600">
              <div className="flex justify-between items-center">
                <label className="text-xs font-bold text-gray-400 dark:text-gray-400 uppercase">Kategorie / Typ</label>
                <select className="bg-transparent font-bold text-sm dark:text-white outline-none" value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})}>
                  {Object.values(CATEGORIES).map(cat => (
                     <option key={cat.id} value={cat.id}>{cat.label}</option>
                  ))}
                </select>
              </div>
            </div>

            {(formData.category === 'coupon' || (formData.category === 'custom' && formData.customOptions.canRedeem)) && (
              <div className="flex space-x-4 animate-in fade-in slide-in-from-top-2">
                <div className="flex-1">
                  <label className="block text-xs font-bold text-gray-400 dark:text-gray-500 uppercase mb-2">Ursprungswert (€)</label>
                  <input type="text" inputMode="decimal" pattern="[0-9]*" className="w-full bg-gray-100 dark:bg-gray-700 dark:text-white p-4 rounded-xl font-bold text-lg" value={formData.initialValue} onChange={(e) => setFormData({...formData, initialValue: e.target.value, currentValue: initialData && initialData.id ? formData.currentValue : e.target.value})} />
                </div>
                {initialData && initialData.id && (
                  <div className="flex-1">
                    <label className="block text-xs font-bold text-gray-400 dark:text-gray-500 uppercase mb-2">Restwert (€)</label>
                    <input type="text" inputMode="decimal" pattern="[0-9]*" className="w-full bg-gray-100 dark:bg-gray-700 dark:text-white p-4 rounded-xl font-bold text-lg" value={formData.currentValue} onChange={(e) => setFormData({...formData, currentValue: e.target.value})} />
                  </div>
                )}
              </div>
            )}

            {formData.category !== 'loyalty' && showExpiryField && (
              <div className="w-full animate-in fade-in slide-in-from-top-2">
                <div className="flex justify-between items-center mb-2">
                  <label className="block text-xs font-bold text-gray-400 dark:text-gray-500 uppercase">
                    {formData.category === 'ticket' ? 'Datum der Veranstaltung' : 'Gültig bis'}
                  </label>
                  <button onClick={() => { setShowExpiryField(false); setFormData({...formData, expiryDate: ''}); }} className="text-gray-400 hover:text-red-500 p-1"><X size={16}/></button>
                </div>
                <input type="date" className="block w-full box-border appearance-none bg-gray-100 dark:bg-gray-700 dark:text-white p-4 rounded-xl font-bold text-lg font-sans" value={formData.expiryDate} onChange={(e) => setFormData({...formData, expiryDate: e.target.value})} />
              </div>
            )}

            {showPinField && (
              <div className="w-full animate-in fade-in slide-in-from-top-2">
                <div className="flex justify-between items-center mb-2">
                  <label className="block text-xs font-bold text-gray-400 dark:text-gray-500 uppercase">PIN / Passwort</label>
                  <button onClick={() => { setShowPinField(false); setFormData({...formData, pin: ''}); }} className="text-gray-400 hover:text-red-500 p-1"><X size={16}/></button>
                </div>
                <input type="text" placeholder="1234" className="block w-full box-border appearance-none bg-gray-100 dark:bg-gray-700 dark:text-white p-4 rounded-xl font-bold text-lg font-mono tracking-widest" value={formData.pin} onChange={(e) => setFormData({...formData, pin: e.target.value})} />
              </div>
            )}

            <div className="pt-2">
                {(!showExpiryField || !showPinField) && <label className="block text-xs font-bold text-gray-400 dark:text-gray-500 uppercase mb-3">Zusätzliche Optionen</label>}
                <div className="space-y-3">
                    {!showExpiryField && formData.category !== 'loyalty' && (
                        <button onClick={() => {
                            setShowExpiryField(true);
                            if (formData.category === 'coupon' && !formData.expiryDate) {
                                setFormData({...formData, expiryDate: `${new Date().getFullYear() + 3}-12-31`});
                            }
                        }} className="w-full flex items-center justify-center gap-2 p-4 bg-white dark:bg-gray-800 rounded-xl border border-dashed border-gray-300 dark:border-gray-600 text-blue-500 font-bold text-sm active:scale-95 transition">
                           <PlusCircle size={18} /> {formData.category === 'ticket' ? 'Veranstaltungsdatum hinzufügen' : 'Ablaufdatum hinzufügen'}
                        </button>
                    )}
                    {!showPinField && (
                        <button onClick={() => setShowPinField(true)} className="w-full flex items-center justify-center gap-2 p-4 bg-white dark:bg-gray-800 rounded-xl border border-dashed border-gray-300 dark:border-gray-600 text-blue-500 font-bold text-sm active:scale-95 transition">
                           <PlusCircle size={18} /> PIN / Code hinzufügen
                        </button>
                    )}
                </div>
            </div>

            {formData.category === 'custom' && (
              <div className="space-y-3 bg-gray-50 dark:bg-gray-700/50 p-4 rounded-2xl border border-gray-100 dark:border-gray-700">
                <button onClick={() => setFormData({...formData, customOptions: {...formData.customOptions, canRedeem: !formData.customOptions.canRedeem}})} className="flex items-center gap-3 w-full">
                  {formData.customOptions.canRedeem ? <CheckSquare className="text-blue-500" /> : <Square className="text-gray-400 dark:text-gray-500" />} <span className="dark:text-white">Einlösen möglich</span>
                </button>
                <button onClick={() => setFormData({...formData, customOptions: {...formData.customOptions, canGift: !formData.customOptions.canGift}})} className="flex items-center gap-3 w-full">
                  {formData.customOptions.canGift ? <CheckSquare className="text-blue-500" /> : <Square className="text-gray-400 dark:text-gray-500" />} <span className="dark:text-white">Verschenken möglich</span>
                </button>
              </div>
            )}

            <div><label className="block text-xs font-bold text-gray-400 dark:text-gray-500 uppercase mb-2">Farbe</label>
            <div className="flex flex-wrap gap-3">{colors.map(c => <button key={c} onClick={() => setFormData({...formData, colorCode: c})} className={`w-10 h-10 rounded-full bg-gradient-to-br ${c} ${formData.colorCode === c ? 'ring-2 ring-black dark:ring-white ring-offset-2 dark:ring-offset-gray-800' : ''}`} />)}</div></div>

            <div>
              <label className="block text-xs font-bold text-gray-400 dark:text-gray-500 uppercase mb-2">Logo</label>
              <label className="flex items-center justify-between w-full p-4 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                {formData.image ? (
                   <div className="flex items-center space-x-4"><div className="w-12 h-12 bg-white rounded-xl p-1 shadow-sm border border-gray-200"><img src={formData.image} alt="Preview" className="w-full h-full rounded-lg object-cover" /></div><span className="text-sm font-semibold text-green-600">Bild geladen (Ändern)</span></div>
                ) : ( <div className="flex items-center space-x-2 text-gray-500 dark:text-gray-400"><Upload size={18} /><span className="font-semibold">Logo wählen</span></div> )}
                <input type="file" accept="image/*" className="hidden" onChange={(e) => { const f = e.target.files[0]; if(f){ const r = new FileReader(); r.onloadend=()=>setFormData({...formData, image: r.result}); r.readAsDataURL(f); } }} />
              </label>
            </div>

            <div className="bg-gray-100 dark:bg-gray-700 p-4 rounded-2xl border border-gray-200 dark:border-gray-600">
              <div className="flex justify-between items-center mb-3">
                <label className="text-xs font-bold text-gray-400 dark:text-gray-400 uppercase">Code</label>
                <select className="bg-transparent font-bold text-sm dark:text-white" value={formData.codeType} onChange={(e) => setFormData({...formData, codeType: e.target.value})}>
                  <option value="BARCODE">Barcode</option><option value="QR">QR Code</option>
                </select>
              </div>
              <input type="text" placeholder="Code..." className="w-full bg-white dark:bg-gray-800 dark:text-white p-3 rounded-xl mb-3 font-mono shadow-inner border dark:border-gray-600" value={formData.codeValue} onChange={(e) => setFormData({...formData, codeValue: e.target.value})} />
              <label className={`flex items-center justify-center gap-2 w-full p-3 rounded-xl cursor-pointer ${isScanning ? 'bg-blue-200 text-blue-800' : 'bg-gray-800 dark:bg-gray-900 text-white active:scale-95 transition'}`}>
                <ImageIcon size={18} /><span>Foto scannen</span>
                <input type="file" accept="image/*" className="hidden" onChange={scanBarcode} />
              </label>
            </div>

            <div className="pt-4 border-t border-gray-100 dark:border-gray-700 space-y-3 pb-8">
              <button onClick={() => onSaveTemplate(formData)} className="w-full flex justify-center items-center gap-2 bg-gray-100 dark:bg-gray-700 dark:text-white p-4 rounded-xl font-bold active:scale-95 transition"><CopyPlus size={18} /> Vorlage speichern</button>
              
              {initialData && initialData.id && onDelete && (
                !showDel ? (
                  <button onClick={() => setShowDel(true)} className="w-full p-4 text-red-500 font-bold active:scale-95 transition flex justify-center items-center gap-2">
                    <Trash2 size={18}/> Karte löschen
                  </button>
                ) : (
                  <div className="flex gap-3 animate-in fade-in slide-in-from-right-4">
                    <button onClick={() => setShowDel(false)} className="flex-1 p-4 bg-gray-100 dark:bg-gray-700 dark:text-white rounded-xl font-bold">Abbrechen</button>
                    <button onClick={onDelete} className="flex-1 p-4 bg-red-500 text-white rounded-xl font-bold shadow-lg">Wirklich löschen</button>
                  </div>
                )
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<NexWallet />);
  </script>
</body>
</html>
